# The `rushi-tui` repo: the swappable TUI front-end (Tier-2,
# docs/tui-ext-repo-split.md). It builds the `tui` binary and the
# std-only `tui-stream-drt` DRT mirror.
#
# Bootstrap split (local path-dep, no remote yet): `rushi-common` is a
# path dep on the sibling kernel checkout (../rust-unix-harness/).
# Flip it to a pinned git dep on the kernel repo at hosting time.

[workspace]
resolver = "2"
members = [
    "bin/tui",
    "bin/tui-stream-drt",
    "crates/tui-highlight",
]

[workspace.dependencies]
# Inherited by `bin/tui` (`bon = { workspace = true }`); it was a member
# of the kernel's root workspace before the split.
bon = "3"
ratatui = "0.30"

[profile.release]
# The TUI binary's final link step was the 2+ minute bottleneck:
# DWARF debuginfo on a ~30 k-LOC crate dominated the tail of the build.
# `debug = "line-tables-only"` keeps enough for stack traces in the
# crash reporter (docs/tui-mem-safety.md) without the full DWARF cost.
debug = "line-tables-only"
# `incremental = true` in release (stable since Rust 1.77): the
# incremental cache cuts warm rebuilds of the final binary by ~40%.
incremental = true
